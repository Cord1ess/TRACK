# Capture Dhaka's traffic, run the pipeline, update the site on GitHub Pages.
#
# The goal is an unbroken sequence: traffic data for every slot, with no window
# missing. Four things keep the chain alive, in order of how often they matter:
#
#   1. a failed capture is retried inside the run, costing ~75 s not a slot
#   2. every run starts the next one whatever its outcome (see the last step)
#   3. GitHub's cron ticks every 5 minutes and revives a chain whose runner died
#   4. an external trigger posts repository_dispatch when GitHub's cron does not
#
# The concurrency group keeps one run going at a time. A trigger arriving
# mid-run becomes the single pending run, and a later one replaces it, so the
# triggers can never stack up. In practice the next run starts the moment the
# current one ends, which is why captures land every ~7 minutes rather than
# every 10: the chain, not the clock, sets the pace.
#
# A run takes about 7 minutes. The road graph is committed (gzipped); the
# pipeline unpacks it and never queries OpenStreetMap here.
#
# deploy.yml publishes the site on every push, so it is live before the first
# capture; this workflow only refreshes it. Optional: repository secrets
# HF_TOKEN and HF_REPO archive every capture to a private Hugging Face dataset;
# without them that step is skipped.

name: collect

on:
  schedule:
    # Every 5 minutes, which is GitHub's minimum. This is NOT the cadence: the
    # chain sets that by starting its own successor. The cron exists only to
    # revive a chain that died without reaching its restart step, which is what
    # happens if the runner itself is killed. The concurrency group below means
    # a tick that arrives while a run is going is simply dropped.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  # An external trigger (cron-job.org or similar) posts this when GitHub's own
  # schedule does not fire. Same job, same guard.
  repository_dispatch:
    types: [collect]

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write                         # a finished run starts the next one

env:
  KEEP: 12                               # captures fetched from the archive and kept on
                                         # the site. Measured: 41 MB each on disk, and the
                                         # published site is 526 MB, over half the 1 GB
                                         # Pages limit. 14 would be ~600 MB, 18 ~745 MB;
                                         # past that the site is the binding constraint,
                                         # not the runner. 12 gives the timeline about
                                         # 90 minutes of sequence to play through.
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_REPO: ${{ secrets.HF_REPO }}
  # Optional: a URL that is pinged after every successful capture. The service
  # alerts when the pings stop, which is how a dead chain is noticed in minutes
  # rather than hours. Unset means the step is skipped.
  HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: https://cord1ess.github.io/TRACK/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Install
        run: pip install -r data-collection/requirements.txt -r algorithms/requirements.txt

      # NO ACTIONS CACHE. Measured: the site is 526 MB, and a new cache entry
      # every 7.5 minutes writes about 101 GB a day against a 10 GB repository
      # cap. The cap is reached in under three hours and then LRU thrashes for
      # the rest of the run, which is a failure mode in itself over two weeks.
      #
      # What it bought: build_site.py skipping tiles for captures already on
      # the site, measured at 139 s of copying per cold build. Two minutes a
      # run is not worth a guaranteed storage failure, and every capture is
      # fetched from the archive anyway, arriving with its pyramids built.

      # The captures live in the archive now, not on disk. The Actions cache is
      # a shortcut, not the source: when it is cold, or a key has been evicted,
      # the site would otherwise be built from the single capture this run
      # takes, and the timeline would collapse to one point. Fetching the
      # newest few back costs seconds and keeps the site whole.
      - name: Fill the captures folder from the archive
        if: env.HF_TOKEN != ''
        working-directory: data-collection
        continue-on-error: true            # a cold archive must not stop a capture
        run: python storage/download.py --to captures --latest "$KEEP"

      # A capture that fails is retried here, in the same run, rather than
      # costing a whole slot. Each attempt takes about 75 s, so three attempts
      # still fit well inside one 10-minute slot. Each gets its own name,
      # because the name carries the minute and a retry inside the same minute
      # would collide with the folder the failed attempt left behind.
      - name: Capture
        id: capture
        working-directory: data-collection
        run: |
          set -u
          for attempt in 1 2 3; do
            NAME="dhaka-$(date -u +%Y-%m-%dT%H%MZ)"
            if [ -e "captures/$NAME" ]; then NAME="${NAME%Z}-$attempt Z"; NAME="${NAME// /}"; fi
            echo "attempt $attempt: $NAME"
            if python collector/capture.py --name "$NAME" --series scheduled; then
              echo "name=$NAME" >> "$GITHUB_OUTPUT"
              echo "attempts=$attempt" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning title=capture::attempt $attempt failed"
            rm -rf "captures/$NAME"
            sleep 5
          done
          echo "::error title=capture::three attempts failed"
          exit 1

      - name: Decode, impute, layers
        working-directory: algorithms
        run: >
          python pipeline.py
          --capture "../data-collection/captures/${{ steps.capture.outputs.name }}"
          --only decode,impute,layers --quick

      # No --prune: it existed to bound the captures the cache carried between
      # runs, and the cache no longer carries them. The runner is thrown away
      # when the run ends, so there is nothing to bound, and pruning would only
      # delete captures this run just downloaded.
      - name: Build the site
        run: python visualizer/build_site.py --out site --keep "$KEEP"

      # The site must publish whether or not the archive accepts the capture.
      # Run #98 failed here on an expired token and skipped deploy, upload and
      # the self-restart with it: one credential took the whole chain down.
      - name: Archive the capture to Hugging Face
        if: env.HF_TOKEN != ''
        working-directory: data-collection
        continue-on-error: true
        run: python storage/upload.py "captures/${{ steps.capture.outputs.name }}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # Tell the heartbeat this run produced data. Silence is what the alert
      # watches for, so this must only fire when the capture actually worked.
      - name: Heartbeat
        if: success() && env.HEARTBEAT_URL != ''
        continue-on-error: true
        run: curl -fsS -m 10 --retry 3 "$HEARTBEAT_URL" || true

      # THE CHAIN. Every run starts the next one, whatever happened to this
      # one. `always()` rather than `success()` is the whole point: a run that
      # failed is exactly when the next one matters most. Run #98 failed on an
      # archive upload and started nothing, and collection was dead for five
      # hours until someone noticed.
      #
      # A failed run waits for the slot boundary before starting its successor.
      # Without that, a permanently broken run that fails in 20 s would respawn
      # itself hundreds of times an hour. With it, failure costs the remainder
      # of the slot and no more, so a broken system retries about six times an
      # hour and a healthy one is never delayed at all.
      #
      # This step is last and runs unconditionally, but a killed runner never
      # reaches it. That case is what the cron and the external trigger cover.
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            # Pace the retry so a run that fails in seconds cannot respawn
            # itself hundreds of times an hour. Capped at 5 minutes: long
            # enough to stop a hot loop, short enough that a transient fault
            # costs one slot and no more. The wait is on a runner, which is
            # free on a public repository.
            SECS=$(( 300 - ($(date -u +%s) % 300) ))
            echo "run ended as $OUTCOME; pacing the retry, waiting ${SECS}s"
            sleep "$SECS"
          fi
          gh workflow run collect.yml --ref "${{ github.ref_name }}"             || echo "::warning title=chain::could not start the next run; cron and the external trigger are the fallback"
