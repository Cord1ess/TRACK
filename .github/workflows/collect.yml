# Capture Dhaka's traffic, run the pipeline, update the site on GitHub Pages.
#
# Triggers every 10 minutes. A capture takes about 1 minute and a run about
# 8; the concurrency group keeps runs from overlapping. The road graph is committed (gzipped); the
# pipeline unpacks it and never queries OpenStreetMap here. A failed capture
# stops the run, so a bad cycle never deploys and the site keeps its last data.
#
# deploy.yml publishes the site on every push, so it is live before the first
# capture; this workflow only refreshes it. Optional: repository secrets
# HF_TOKEN and HF_REPO archive every capture to a private Hugging Face dataset;
# without them that step is skipped.

name: collect

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write                         # a finished run starts the next one

env:
  KEEP: 12                               # captures kept on the site and between runs.
                                         # 12 at ~38 MB of tiles each is about 450 MB,
                                         # inside the 1 GB Pages limit, and gives the
                                         # timeline two hours of sequence to play through.
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_REPO: ${{ secrets.HF_REPO }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: https://cord1ess.github.io/TRACK/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Install
        run: pip install -r data-collection/requirements.txt -r algorithms/requirements.txt

      - name: Restore the previous captures and site
        uses: actions/cache/restore@v4
        with:
          path: |
            data-collection/captures
            site
          key: captures-${{ github.run_id }}
          restore-keys: captures-

      # The captures live in the archive now, not on disk. The Actions cache is
      # a shortcut, not the source: when it is cold, or a key has been evicted,
      # the site would otherwise be built from the single capture this run
      # takes, and the timeline would collapse to one point. Fetching the
      # newest few back costs seconds and keeps the site whole.
      - name: Fill the captures folder from the archive
        if: env.HF_TOKEN != ''
        working-directory: data-collection
        continue-on-error: true            # a cold archive must not stop a capture
        run: python storage/download.py --to captures --latest "$KEEP"

      - name: Capture
        id: capture
        working-directory: data-collection
        run: |
          NAME="dhaka-$(date -u +%Y-%m-%dT%H%MZ)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          python collector/capture.py --name "$NAME" --series scheduled

      - name: Decode, impute, layers
        working-directory: algorithms
        run: >
          python pipeline.py
          --capture "../data-collection/captures/${{ steps.capture.outputs.name }}"
          --only decode,impute,layers --quick

      - name: Build the site
        run: python visualizer/build_site.py --out site --keep "$KEEP" --prune

      # The site must publish whether or not the archive accepts the capture.
      # Run #98 failed here on an expired token and skipped deploy, upload and
      # the self-restart with it: one credential took the whole chain down.
      - name: Archive the capture to Hugging Face
        if: env.HF_TOKEN != ''
        working-directory: data-collection
        continue-on-error: true
        run: python storage/upload.py "captures/${{ steps.capture.outputs.name }}"

      - name: Keep the captures and site for the next run
        uses: actions/cache/save@v4
        with:
          path: |
            data-collection/captures
            site
          key: captures-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub's schedule is best effort: it did not fire once in the hour
      # after this file landed. So a finished run starts the next one itself,
      # and the schedule only has to restart the chain after a failed capture.
      - name: Start the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref "${{ github.ref_name }}"
