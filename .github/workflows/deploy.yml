# Publish the site from the data already collected: on every push that changes
# the app or the algorithms, and on demand. This is what makes the site live
# before the first capture. collect.yml updates it after every capture.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub
# Actions. The workflow token cannot turn Pages on by itself.
#
# Data comes from the Hugging Face archive, which is where captures live. The
# site built by the last collection run is restored from the cache so tiles it
# already holds are not copied again. Without the archive secrets the site is
# published with the road graph alone.

name: deploy

on:
  push:
    branches: [main]
    paths:
      - visualizer/**
      - algorithms/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  KEEP: 12
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_REPO: ${{ secrets.HF_REPO }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: https://cord1ess.github.io/TRACK/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Install
        run: pip install -r data-collection/requirements.txt -r algorithms/requirements.txt

      # collect.yml caches the site under site-<run id>; restore-keys finds the
      # most recent. It no longer caches the captures, so there is nothing to
      # restore for those: the archive is their only source.
      - name: Restore the site built by the last collection run
        uses: actions/cache/restore@v4
        with:
          path: site
          key: site-none
          restore-keys: site-

      # The archive is the only source of captures. download.py skips any that
      # are already on disk, which on a fresh runner is none of them.
      - name: Fetch the newest captures from the archive
        if: env.HF_TOKEN != ''
        working-directory: data-collection
        continue-on-error: true            # publish the graph rather than fail
        run: python storage/download.py --to captures --latest "$KEEP"

      - name: Run the pipeline on the newest capture, if there is one
        working-directory: algorithms
        run: |
          NEWEST=$(python - <<'EOF'
          import json, pathlib
          caps = []
          for m in pathlib.Path("../data-collection/captures").glob("*/manifest.json"):
              d = json.loads(m.read_text(encoding="utf-8"))
              if d.get("status") in ("ok", "partial"):
                  caps.append((d.get("captured_utc", ""), m.parent.name))
          print(max(caps)[1] if caps else "")
          EOF
          )
          if [ -n "$NEWEST" ]; then
            echo "newest capture: $NEWEST"
            python pipeline.py --capture "../data-collection/captures/$NEWEST" --only decode,impute,layers --quick
          else
            echo "no captures yet: the site is built with the road graph only"
          fi

      - name: Build the site
        run: python visualizer/build_site.py --out site --keep "$KEEP"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
