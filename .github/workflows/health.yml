# Once a day, report on yesterday's captures in the Hugging Face archive.
# The run fails when the day was below the thresholds at the top of
# data-collection/scheduler/daily_check.py, which GitHub reports by email.
# Does nothing without the HF_TOKEN and HF_REPO secrets.

name: health

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_REPO: ${{ secrets.HF_REPO }}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-collection/requirements.txt

      - name: Install
        if: env.HF_TOKEN != ''
        run: pip install -r data-collection/requirements.txt

      - name: Check yesterday
        if: env.HF_TOKEN != ''
        working-directory: data-collection
        run: python scheduler/daily_check.py
